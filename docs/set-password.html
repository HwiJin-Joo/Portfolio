<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>편집기 비밀번호 변경</title>
<style>
body{margin:0;background:#0B0C0F;color:#EDEFF3;font:15px/1.7 -apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.box{width:100%;max-width:560px}
h1{font-size:20px;margin:0 0 6px}
p{color:#8A92A0;font-size:14px;margin:0 0 22px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8A92A0;margin-bottom:7px}
input{width:100%;font:inherit;font-size:16px;color:#EDEFF3;background:#14161C;border:1px solid rgba(255,255,255,.12);
 border-radius:10px;padding:12px 14px;box-sizing:border-box}
input:focus{outline:2px solid #FF4B33;outline-offset:1px;border-color:transparent}
button{margin-top:14px;font:inherit;font-size:14px;font-weight:600;padding:12px 20px;border-radius:9px;
 background:#FF4B33;border:0;color:#0A0B0D;cursor:pointer}
.out{margin-top:26px;display:none}
code{display:block;background:#14161C;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;
 font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:#EDEFF3}
ol{color:#A7AEBA;font-size:14px;padding-left:20px;margin-top:16px}
li{margin-bottom:6px}
.copy{background:transparent;border:1px solid rgba(255,255,255,.18);color:#EDEFF3;margin-top:10px;padding:8px 14px;font-size:13px}
</style></head><body><div class="box">
<h1>편집기 비밀번호 변경</h1>
<p>새 비밀번호를 넣으면 파일에 붙여넣을 한 줄이 나옵니다. 비밀번호 자체는 어디에도 저장되지 않습니다.</p>
<label for="p">새 비밀번호</label>
<input id="p" type="text" placeholder="원하는 비밀번호" autocomplete="off">
<button id="go">한 줄 만들기</button>
<div class="out" id="out">
  <code id="line"></code>
  <button class="copy" id="cp">복사</button>
  <ol>
    <li><code style="display:inline;padding:2px 6px">assets/gate.js</code> 를 메모장으로 엽니다</li>
    <li>맨 위 <code style="display:inline;padding:2px 6px">window.PW_HASH = "…";</code> 줄을 위 한 줄로 통째로 바꿉니다</li>
    <li>저장 → 커밋 → push</li>
  </ol>
</div>
<script>
document.getElementById('go').onclick=async function(){
  var v=document.getElementById('p').value;
  if(!v){alert('비밀번호를 입력하세요');return}
  var b=new TextEncoder().encode(v), h=await crypto.subtle.digest('SHA-256',b);
  var hex=[].map.call(new Uint8Array(h),function(x){return x.toString(16).padStart(2,'0')}).join('');
  document.getElementById('line').textContent='window.PW_HASH = "'+hex+'";';
  document.getElementById('out').style.display='block';
};
document.getElementById('cp').onclick=function(){
  navigator.clipboard.writeText(document.getElementById('line').textContent);
  this.textContent='복사됨';
  var b=this; setTimeout(function(){b.textContent='복사'},1500);
};
</script></div></body></html>
